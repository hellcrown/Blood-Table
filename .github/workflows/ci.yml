name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 全量测试（server + client）
        run: npm test
      - name: 构建产物守卫（防改了 src 忘记重建 dist 就提交）
        run: npm run check:dist
