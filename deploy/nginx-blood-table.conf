# 血色牌局线上 nginx 反代配置（/etc/nginx/sites-available/blood）
# 80 强制跳转 443；443 TLS 由 certbot 签发并自动续期（Let's Encrypt）
# /ws 为 WebSocket 升级代理，长超时防止对局被掐断

server {
    server_name blood-table.top www.blood-table.top;

    # gzip 压缩：JS/CSS/JSON/SVG 经 Node 代理返回，必须配 gzip_proxied 才会对上游响应生效
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/javascript application/javascript text/css application/json image/svg+xml;

    # 带内容哈希的静态资源：一年长缓存（换版本 = 换文件名，不会脏）
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA 入口：始终协商缓存，保证发版后立刻拿到新版本
    # （同时覆盖 / 与 /index.html：用户访问的是根路径，只配 = /index.html 会漏掉）
    location = /index.html {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }

    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # HTML/API 等非哈希资源一律协商缓存；/assets/ 与 /ws 有各自 location 不受影响
        add_header Cache-Control "no-cache";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/blood-table.top/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/blood-table.top/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.blood-table.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = blood-table.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name blood-table.top www.blood-table.top;
    return 404; # managed by Certbot




}