# 血色牌局线上 nginx 反代配置（/etc/nginx/sites-available/blood）
# 80 强制跳转 443；443 TLS 由 certbot 签发并自动续期（Let's Encrypt）
# /ws 为 WebSocket 升级代理，长超时防止对局被掐断

server {
    server_name blood-table.top www.blood-table.top;

    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/blood-table.top/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/blood-table.top/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.blood-table.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = blood-table.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name blood-table.top www.blood-table.top;
    return 404; # managed by Certbot




}